<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7b6c">
<meta name="description" content="Udhar Khata — offline credit ledger for Indian shopkeepers. Track who owes you, send WhatsApp reminders, works without internet.">
<title>Udhar Khata</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <button class="icon-btn" id="backBtn" hidden aria-label="Back">&#8592;</button>
  <h1 id="title">Udhar Khata</h1>
  <button class="icon-btn" id="settingsBtn" aria-label="Settings">&#9881;</button>
</header>

<main id="view" class="view"></main>

<!-- Bottom sheet used for all forms (add customer, add entry, etc.) -->
<div class="sheet-backdrop" id="sheetBackdrop" hidden>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle"></h2>
    <div id="sheetBody"></div>
  </section>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/store.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
